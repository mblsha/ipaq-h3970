<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
  <title>iPAQ H3970 USB tools</title>
  <link rel="stylesheet" href="./xterm.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <header class="device-header">
      <div>
        <h1>iPAQ H3970</h1>
        <p id="device" class="muted" aria-live="polite">No iPAQ connected</p>
      </div>
      <div class="button-row">
        <button id="connect">Connect iPAQ</button>
        <button id="disconnect" class="secondary" disabled hidden>Disconnect</button>
      </div>
    </header>
    <section id="permissions" aria-label="Browser permissions" hidden>
      <p>Choose the iPAQ’s current mode to grant browser access.</p>
      <div class="button-row">
        <button id="allow-wince" class="secondary">WinCE USB</button>
        <button id="allow-linux" class="secondary">Linux serial</button>
      </div>
    </section>
    <section id="release-panel" class="installer row" aria-label="Install Doom">
      <div>
        <p id="kit-version">Checking for a released kit…</p>
        <a id="kit-release" hidden>Release and licenses</a>
      </div>
      <button id="install" disabled>Install and start Doom</button>
    </section>
    <details id="wince-tools" class="wince-tools">
      <summary>WinCE tools</summary>
      <div class="tool-fields">
        <label id="password-field">ActiveSync password <span class="muted">(optional)</span>
          <input id="password" type="password" autocomplete="off" maxlength="127">
        </label>
        <button id="dump" class="secondary" disabled>Dump ROM</button>
        <details>
          <summary>Use your own kit</summary>
          <label>DOOMUSB.BIN<input id="image" type="file" accept=".bin"></label>
          <label>DOOMUSB.EXE<input id="launcher" type="file" accept=".exe"></label>
          <button id="upload" class="secondary" disabled>Upload and verify</button>
        </details>
      </div>
    </details>
    <section id="doom-controls" class="doom-controls" aria-labelledby="doom-heading" hidden>
      <div class="row">
        <h2 id="doom-heading">Doom</h2>
        <div class="button-row">
          <button id="audio" class="secondary" aria-pressed="false" title="Changing audio restarts the demo" disabled>Audio</button>
          <button id="restart" class="secondary" disabled>Restart demo</button>
          <button id="exit-doom" class="secondary" hidden disabled>Exit Doom</button>
        </div>
      </div>
      <div id="mix" class="mix" hidden>
        <label>Music <span id="music-level"></span>
          <input id="music-volume" type="range" min="0" max="100" value="100" disabled>
        </label>
        <label>Sound effects <span id="effect-level"></span>
          <input id="effect-volume" type="range" min="0" max="100" value="100" disabled>
        </label>
      </div>
    </section>
    <section id="terminal-panel" class="terminal-panel" aria-labelledby="terminal-heading" hidden>
      <h2 id="terminal-heading">BusyBox terminal</h2>
      <div id="terminal-screen" class="terminal-screen"></div>
      <p id="terminal-status" class="muted" role="status"></p>
    </section>
    <section id="linux-actions" class="linux-actions" aria-label="Linux device actions" hidden>
      <div class="button-row">
        <button id="start" hidden disabled>Start demo</button>
        <button id="reset" class="secondary" aria-describedby="reset-hint" disabled>Reset to WinCE</button>
      </div>
      <p id="reset-hint" class="muted" hidden></p>
    </section>
    <div id="status" class="status" role="status"></div>
    <div id="transfer" class="transfer" hidden>
      <progress id="progress" aria-label="Transfer progress" max="1" value="0"></progress>
      <span id="amount" aria-hidden="true"></span>
    </div>
    <a id="download" download="H3970ROM.BIN" hidden>Save ROM image</a>
    <output id="hashes" hidden></output>
  </main>
</body>
</html>
