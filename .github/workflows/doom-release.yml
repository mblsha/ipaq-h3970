name: Build H3970 Linux and Doom kit

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: doom-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install kernel and WinCE build dependencies
        timeout-minutes: 5
        run: |
          sources="$RUNNER_TEMP/ubuntu.sources"
          sed -e 's|http://|https://|g' -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources > "$sources"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=2 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            clang-18 llvm-18 lld-18 flex bison bc libssl-dev libelf-dev \
            gcc-arm-linux-gnueabi libc6-dev-armel-cross \
            gcc-arm-none-eabi binutils-arm-none-eabi device-tree-compiler
      - name: Build Linux and Doom release assets
        env:
          LLVM: '-18'
        run: make release BUILD_DIR="$RUNNER_TEMP/ipaq-build"
      - uses: actions/upload-artifact@v7
        with:
          name: ipaq-h3970-release
          path: ${{ runner.temp }}/ipaq-build/release/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipaq-h3970-release
      - name: Attach assets to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          assets=(ipaq-h3970-doom.zip ipaq-h3970-source-inputs.tar.gz SHA256SUMS)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo 'This tag already has a published release.' >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft \
              --title "iPAQ H3970 Linux and Doom $GITHUB_REF_NAME" \
              --notes 'Unzip `ipaq-h3970-doom.zip` and follow `README.txt`. The kit boots Linux in RAM and includes the Doom 1.9 shareware demo. Upload the matching EXE and BIN with the [WebUSB tools](https://mblsha.github.io/ipaq-h3970/).'
          fi
