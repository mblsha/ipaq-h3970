name: Publish WebUSB tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - Makefile
      - "web/**"
      - "wince/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Install Arm cross-compiler
        run: |
          cd "$RUNNER_TEMP"
          toolchain=gcc-arm-none-eabi-9-2019-q4-major
          archive="$toolchain-x86_64-linux.tar.bz2"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 120 \
            "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/9-2019q4/$archive" \
            --output "$archive"
          printf '%s  %s\n' bcd840f839d5bf49279638e9f67890b2ef3a7c9c7a9b25271e83ec4ff41d177a "$archive" | sha256sum --check
          tar -xjf "$archive"
          printf '%s\n' "$RUNNER_TEMP/$toolchain/bin" >> "$GITHUB_PATH"
      - name: Install Rust WASM toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build static site
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: make web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
