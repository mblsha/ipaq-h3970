name: Publish WebUSB tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - Makefile
      - "web/**"
      - "wince/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build static site
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        run: make web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
